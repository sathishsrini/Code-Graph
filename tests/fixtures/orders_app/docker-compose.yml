services:
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/orders
      PAYMENT_URL: http://payments:8080
      KAFKA_BROKERS: kafka:9092
    depends_on: [db, kafka, payments]
    ports: ["8000:8000"]
  worker:
    build: ./api
    command: python -m worker.consumers
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on: [kafka]
  payments:
    build: ./payments
    ports: ["8080:8080"]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
  kafka:
    image: bitnami/kafka:3.7
