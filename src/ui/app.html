<!doctype html>
<!--
  code-intel viewer — tasks P2-T1 … P2-T5, P2-T12 (R45, R49, R50, R78)

  One file, no bundler, no CDN. elkjs does the layered layout; the rendering is
  plain SVG, which is why this needs no build step.

  THE ONE RULE THIS UI EXISTS TO OBEY: two independent visual axes.

    line style  =  confidence   how sure we are the edge EXISTS
    colour      =  outcome      whether that path SUCCEEDS or ERRORS

  A dashed green edge is "we are unsure this call happens, on a path we are
  sure succeeds". A solid red one is "this call definitely happens, on a path
  that errors". Merging them into one "status" is the easy mistake and R78
  forbids it — the legend states the difference and is always on screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-intel</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --dim: #8b949e; --certain: #58a6ff; --inferred: #d29922; --observed: #3fb950;
    --unresolved: #f85149; --success: #3fb950; --error: #f85149; --unknown: #8b949e;
    --route: #1f6feb; --check-boot: #238636; --check-inline: #2ea043;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: grid; grid-template-columns: var(--side-left) 4px 1fr 4px var(--side-right);
    height: 100vh;
  }
  aside, #inspector {
    background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  #inspector { border-right: none; border-left: 1px solid var(--border);
               overflow-x: auto; }
  .resize-handle {
    cursor: col-resize; background: transparent;
    transition: background .15s;
  }
  .resize-handle:hover, .resize-handle.dragging {
    background: var(--certain);
  }
  main { position: relative; overflow: hidden; }
  h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .04em; }
  h2 { font-size: 11px; color: var(--dim); margin: 16px 0 6px;
       text-transform: uppercase; letter-spacing: .08em; }
  .route { padding: 5px 7px; border-radius: 4px; cursor: pointer;
           border: 1px solid transparent; font-size: 12px; }
  .route:hover { background: #21262d; }
  .route[aria-current="true"] { border-color: var(--certain); background: #21262d; }
  .route .m { color: var(--dim); }
  .badge { display: inline-block; font-size: 9px; padding: 0 4px; border-radius: 6px;
           margin-left: 4px; vertical-align: middle; }
  /* R50: filled = the framework reported it. Outlined = a parser guessed it. */
  .badge.boot { background: var(--check-boot); color: #fff; }
  .badge.inline { border: 1px dashed var(--check-inline); color: var(--check-inline); }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .lane { fill: #ffffff06; stroke: var(--border); stroke-dasharray: 4 4; }
  .lane-label { fill: var(--dim); font-size: 11px; }
  .n rect, .n polygon, .n ellipse { stroke-width: 1.5; }
  .n text { font-size: 11px; fill: var(--text); pointer-events: none; }
  .n { cursor: pointer; }
  .n.sel rect, .n.sel polygon, .n.sel ellipse { stroke-width: 3; }
  .e { fill: none; stroke-width: 1.6; }
  .e.certain { stroke: var(--certain); }
  .e.observed { stroke: var(--observed); stroke-width: 3; }
  .e.inferred { stroke: var(--inferred); stroke-dasharray: 6 4; }
  .e.unresolved { stroke: var(--unresolved); stroke-dasharray: 2 3; }
  /* Halo, so a label crossing its own line stays readable without a backing
     rectangle that would hide whatever the line passes over. */
  .elabel { font-size: 9px; fill: var(--dim); pointer-events: none;
            paint-order: stroke; stroke: var(--bg); stroke-width: 3px;
            stroke-linejoin: round; }
  /* Focus mode: selecting a node fades everything it does not touch. Fades
     rather than hides — a neighbourhood shown alone reads as the whole graph. */
  #viewport.focus .n:not(.on), #viewport.focus .e:not(.on),
  #viewport.focus .elabel:not(.on) { opacity: .12; }
  #viewport .n, #viewport .e, #viewport .elabel { transition: opacity .12s; }
  #legend { position: absolute; right: 10px; bottom: 10px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
            font-size: 10px; line-height: 1.7; max-width: 300px; }
  #legend b { color: var(--text); font-weight: 600; }
  #legend .row { color: var(--dim); }
  #legend .sep { border-top: 1px solid var(--border); margin: 6px 0; }
  .k { color: var(--dim); }
  .cfg { margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--border); }
  .cfg.error_exit { border-color: var(--error); }
  .cfg.success { border-color: var(--success); }
  .cfg.unknown { border-color: var(--unknown); }
  /* The decision-structure flowchart. Shape carries the construct, colour the
     outcome — the same two-axis rule the main graph obeys. */
  /* `width/height: 100%` from the `svg` rule above applies here too, and it is
     what stretched this to the height of the panel. Sized explicitly instead,
     in drawFlowchart, so the diagram keeps its own proportions. */
  #flow { width: auto; height: auto; cursor: default;
          background: #0d111788; border: 1px solid var(--border);
          border-radius: 6px; margin: 6px 0; display: block; }
  #flow .b { fill: #ffffff08; stroke: #8b949e; stroke-width: 1.4; }
  #flow .b.decision { fill: #d2992218; stroke: var(--inferred); }
  #flow .b.terminal { fill: #ffffff10; stroke: var(--dim); }
  #flow .b.success { stroke: var(--success); fill: #3fb95018; }
  #flow .b.error_exit { stroke: var(--error); fill: #f8514918; }
  #flow .b.unknown { stroke: var(--unknown); }
  #flow text { font-size: 9px; fill: var(--text); }
  #flow .arm { font-size: 8px; fill: var(--dim); }
  #flow .fe { fill: none; stroke: #6e7681; stroke-width: 1.2; }
  #flow .fe.true { stroke: var(--success); }
  #flow .fe.false { stroke: var(--dim); }
  #flow .fe.catch { stroke: var(--error); stroke-dasharray: 4 3; }
  #flow .fe.loop_back { stroke: var(--certain); stroke-dasharray: 3 3; }
  .warn { color: var(--inferred); }
  .gap { color: var(--unresolved); }
  button, select, input {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font: inherit; font-size: 11px;
  }
  label { display: block; margin: 4px 0; color: var(--dim); font-size: 11px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center;
           color: var(--dim); text-align: center; padding: 20px; }
</style>
</head>
<body>
<aside>
  <h1>code-intel</h1>
  <input id="filter" placeholder="filter routes…" style="width:100%">
  <h2>Routes</h2>
  <div id="routes"></div>
</aside>

<div class="resize-handle" data-col="0" title="drag to resize"></div>

<main>
  <svg id="canvas"><g id="viewport"></g></svg>
  <div id="empty">pick a route</div>
  <div id="legend"></div>
</main>

<div class="resize-handle" data-col="1" title="drag to resize"></div>

<aside id="inspector"><p class="k">Select a node.</p></aside>

<script src="/elk.js"></script>
<script>
const elk = new ELK();
const $ = (id) => document.getElementById(id);
let payload = null, selected = null, view = { x: 40, y: 40, k: 0.9 };

// ---------------------------------------------------------------------------
// Node shapes carry KIND; colour carries outcome. Two channels, never merged.
// ---------------------------------------------------------------------------
const SHAPE = {
  route:     { w: 210, h: 40, fill: "#1f6feb22", stroke: "var(--route)" },
  symbol:    { w: 180, h: 34, fill: "#ffffff08", stroke: "#8b949e" },
  check:     { w: 180, h: 34, fill: "transparent", stroke: "var(--check-inline)" },
  chain:     { w: 180, h: 34, fill: "#ffffff04", stroke: "#484f58" },
  external:  { w: 170, h: 30, fill: "#8b949e18", stroke: "#484f58" },
  datastore: { w: 170, h: 34, fill: "#9a670022", stroke: "#9a6700" },
  config:    { w: 170, h: 30, fill: "#9a670012", stroke: "#9a6700" },
  file:      { w: 180, h: 30, fill: "#ffffff04", stroke: "#484f58" },
};
const shapeOf = (kind) => SHAPE[kind] ?? SHAPE.symbol;

/**
 * Edge types worth a word on the canvas.
 *
 * `CALLS` is the assumed relationship and `CHAIN`/`CHECKS`/`HANDLES` are
 * already legible from the boxes they join, so labelling those would put text
 * on nearly every line and bury the four that change what the edge means: a
 * network hop, a write, a read, a throw.
 */
const EDGE_TEXT = {
  REQUESTS: "http", WRITES: "writes", READS: "reads",
  THROWS: "throws", READS_CONFIG: "config",
};
const LABELLED_EDGE = new Set(Object.keys(EDGE_TEXT));
const CONFIDENCES = ["certain", "observed", "inferred", "unresolved"];

async function boot() {
  const routes = await (await fetch("/api/routes")).json();
  renderRoutes(routes);
  $("filter").addEventListener("input", () => renderRoutes(routes));
  renderLegend();
}

function renderRoutes(routes) {
  const q = $("filter").value.toLowerCase();
  const list = routes.filter((r) =>
    `${r.service} ${r.method} ${r.url}`.toLowerCase().includes(q));
  $("routes").innerHTML = "";
  let service = null;
  for (const r of list) {
    if (r.service !== service) {
      service = r.service;
      const h = document.createElement("h2");
      h.textContent = service;
      $("routes").append(h);
    }
    const el = document.createElement("div");
    el.className = "route";
    el.dataset.key = `${r.service}|${r.method}|${r.url}`;
    // The picker already distinguishes the two channels, so the difference is
    // visible before anything is opened.
    el.innerHTML =
      `<span class="m">${r.method}</span> ${escapeHtml(r.url)}` +
      r.checks.map((c) => `<span class="badge ${c.channel}">${c.kind}</span>`).join("");
    el.onclick = () => load(r);
    $("routes").append(el);
  }
}

async function load(route) {
  for (const el of document.querySelectorAll(".route")) {
    el.setAttribute("aria-current",
      String(el.dataset.key === `${route.service}|${route.method}|${route.url}`));
  }
  const url = `/api/graph?service=${encodeURIComponent(route.service)}` +
    `&method=${encodeURIComponent(route.method)}&path=${encodeURIComponent(route.url)}`;
  const res = await fetch(url);
  if (!res.ok) {
    $("empty").textContent = (await res.json()).error;
    $("empty").style.display = "grid";
    return;
  }
  payload = await res.json();
  $("empty").style.display = "none";
  await draw();
  renderLegend();
  inspectRoute();
}

// ---------------------------------------------------------------------------
// Layout: elkjs `layered`, with a compound node per service (P2-T5 swim-lanes)
// ---------------------------------------------------------------------------
async function draw() {
  const byService = new Map();
  // Which lane each node landed in. Needed to put ELK's edge geometry back into
  // the right coordinate space — see the note above the route collection below.
  const laneOf = new Map();
  for (const n of payload.nodes) {
    const key = n.service ?? "(external)";
    if (!byService.has(key)) byService.set(key, []);
    byService.get(key).push(n);
    laneOf.set(n.id, `lane:${key}`);
  }

  const graph = {
    id: "root",
    layoutOptions: {
      "elk.algorithm": "layered",
      "elk.direction": "RIGHT",
      "elk.spacing.nodeNode": "26",
      "elk.layered.spacing.nodeNodeBetweenLayers": "70",
      "elk.hierarchyHandling": "INCLUDE_CHILDREN",
      // Ask for real routes. Without this the edges below have no bend points
      // to follow and every long edge cuts straight through whatever is
      // between its endpoints.
      "elk.edgeRouting": "POLYLINE",
      "elk.spacing.edgeNode": "18",
      "elk.layered.spacing.edgeNodeBetweenLayers": "18",
    },
    children: [...byService.entries()].map(([service, nodes]) => ({
      id: `lane:${service}`,
      layoutOptions: { "elk.padding": "[top=34,left=16,bottom=16,right=16]" },
      children: nodes.map((n) => {
        const s = shapeOf(n.kind);
        return { id: n.id, width: s.w, height: s.h };
      }),
    })),
    edges: payload.edges.map((e) => ({
      id: e.id, sources: [e.source], targets: [e.target],
    })),
  };

  const laid = await elk.layout(graph);
  const vp = $("viewport");
  vp.innerHTML = "";
  vp.classList.remove("focus");
  selected = null;
  // Before the edges, which reference the markers by id.
  ensureDefs();

  const positions = new Map();
  const laneAt = new Map();
  for (const lane of laid.children ?? []) {
    laneAt.set(lane.id, { x: lane.x, y: lane.y });
    const g = svg("g");
    g.append(rect(lane.x, lane.y, lane.width, lane.height, "lane"));
    const label = svg("text", {
      x: lane.x + 10, y: lane.y + 20, class: "lane-label",
    });
    label.textContent = lane.id.replace(/^lane:/, "");
    g.append(label);
    vp.append(g);
    for (const child of lane.children ?? []) {
      positions.set(child.id, {
        x: lane.x + child.x, y: lane.y + child.y,
        w: child.width, h: child.height,
      });
    }
  }

  // ELK reports an edge's geometry relative to the LOWEST COMMON ANCESTOR of
  // its endpoints: the lane when both boxes sit inside one, the root when the
  // edge crosses lanes. Under `INCLUDE_CHILDREN` it still *files* every edge at
  // the root, so the ancestor has to be worked out from the endpoints — taking
  // the container it was found in gets same-lane edges wrong by a whole lane
  // offset (measured: up to 987px adrift on a three-lane route).
  //
  // Ignoring all of this is what the canvas did before: it built this layout,
  // discarded the routes, and drew a bezier from source-right to target-left,
  // which is why long edges swept past the lanes instead of following them.
  const routed = new Map();
  const collect = (container, off) => {
    for (const e of container.edges ?? []) {
      const lane = laneOf.get(e.sources[0]);
      const sameLane = lane === laneOf.get(e.targets[0]);
      routed.set(e.id, { e, off: sameLane ? laneAt.get(lane) ?? off : off });
    }
    for (const child of container.children ?? []) {
      collect(child, laneAt.get(child.id) ?? off);
    }
  };
  collect(laid, { x: 0, y: 0 });

  for (const e of payload.edges) {
    const a = positions.get(e.source), b = positions.get(e.target);
    if (!a || !b) continue;

    const hit = routed.get(e.id);
    const off = hit?.off ?? { x: 0, y: 0 };
    const section = hit?.e.sections?.[0];
    const points = section
      ? [section.startPoint, ...(section.bendPoints ?? []), section.endPoint]
        .map((p) => ({ x: p.x + off.x, y: p.y + off.y }))
      // No route came back: a straight segment between the two boxes is at
      // least honest about being unrouted, where a fabricated curve is not.
      : [{ x: a.x + a.w, y: a.y + a.h / 2 }, { x: b.x, y: b.y + b.h / 2 }];

    const path = svg("path", {
      class: `e ${e.confidence}`,
      "data-edge": e.id,
      "data-source": e.source,
      "data-target": e.target,
      d: points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" "),
      "stroke-linejoin": "round",
      "marker-end": `url(#arrow-${e.confidence})`,
    });
    const title = svg("title");
    // Both axes in the tooltip, named, so hovering teaches the distinction.
    title.textContent =
      `${e.type}\nedge confidence: ${e.confidence}\npath confidence: ${e.pathConfidence}`;
    path.append(title);
    vp.append(path);

    // Label only the relationships a reader cannot infer from position and
    // shape. CALLS is the assumed edge and HANDLES is obvious from the route
    // box it leaves — labelling those adds noise, not information.
    if (LABELLED_EDGE.has(e.type)) {
      const mid = midpointOf(points);
      const t = svg("text", {
        class: "elabel", x: mid.x, y: mid.y - 5, "text-anchor": "middle",
        "data-edge": e.id, "data-source": e.source, "data-target": e.target,
      });
      t.textContent = EDGE_TEXT[e.type] ?? e.type;
      vp.append(t);
    }
  }

  for (const n of payload.nodes) {
    const p = positions.get(n.id);
    if (!p) continue;
    const s = shapeOf(n.kind);
    const g = svg("g", { class: "n", "data-id": n.id });
    const box = rect(p.x, p.y, p.w, p.h, "");
    box.setAttribute("rx", n.kind === "route" ? "18" : "5");
    box.setAttribute("fill", s.fill);
    box.setAttribute("stroke", strokeFor(n, s.stroke));
    if (n.chain?.channel === "inline") box.setAttribute("stroke-dasharray", "5 3");
    g.append(box);

    // The chain's position, inline. "Ordered middleware/auth chain" is one of
    // the four questions this tool answers, and before this the order was only
    // implied by where the layout happened to put the box.
    const t = svg("text", { x: p.x + 10, y: p.y + p.h / 2 + 4 });
    const prefix = n.chain ? `${n.chain.position}. ` : "";
    t.textContent = prefix + clip(n.label, Math.floor((p.w - 20) / 6.6) - prefix.length);
    g.append(t);

    if (n.chain?.checkKind) {
      const badge = svg("text", {
        x: p.x + p.w - 8, y: p.y + 12, "text-anchor": "end",
        fill: n.chain.channel === "boot" ? "var(--check-boot)" : "var(--check-inline)",
        "font-size": "9",
      });
      badge.textContent = `${n.chain.checkKind}·${n.chain.channel}`;
      g.append(badge);
    }

    g.onclick = () => inspect(n);
    vp.append(g);
  }

  applyView();
}

/**
 * Focus the selected node's immediate neighbourhood.
 *
 * On a route with thirty nodes the question is never "what is on this graph",
 * it is "what does THIS touch" — and that answer was previously only in the
 * inspector's edge list, in text, next to a picture that showed everything at
 * once. Dimming puts the same answer on the canvas without removing the
 * context that makes it mean something.
 */
function focusOn(nodeId) {
  const vp = $("viewport");
  for (const el of vp.querySelectorAll(".on")) el.classList.remove("on");
  if (!nodeId) { vp.classList.remove("focus"); return; }

  const near = new Set([nodeId]);
  for (const e of payload.edges) {
    if (e.source === nodeId) near.add(e.target);
    else if (e.target === nodeId) near.add(e.source);
  }
  for (const el of vp.querySelectorAll(".n")) {
    el.classList.toggle("on", near.has(el.dataset.id));
  }
  for (const el of vp.querySelectorAll("[data-edge]")) {
    el.classList.toggle("on",
      el.dataset.source === nodeId || el.dataset.target === nodeId);
  }
  vp.classList.add("focus");
}

/**
 * Node stroke = OUTCOME where we know it, kind otherwise.
 *
 * Never confidence — that is the edges' axis. A node coloured by confidence
 * and an edge styled by it say the same thing twice and leave outcome
 * unrepresented, which is exactly the conflation R78 forbids.
 */
function strokeFor(n, fallback) {
  const cfg = payload.cfg[n.key];
  if (!cfg) return fallback;
  const exits = cfg.blocks.filter((b) => b.kind === "exit");
  if (exits.length === 0) return fallback;
  if (exits.every((e) => e.outcome === "error_exit")) return "var(--error)";
  if (exits.some((e) => e.outcome === "error_exit")) return "var(--inferred)";
  if (exits.every((e) => e.outcome === "success")) return "var(--success)";
  return "var(--unknown)";
}

// ---------------------------------------------------------------------------
// Inspector (P2-T3) and the branch view (P2-T12)
// ---------------------------------------------------------------------------
function inspect(n) {
  // Clicking the selected node again clears the focus, so the whole graph is
  // always one click away rather than needing the route re-loaded.
  const same = selected === n.id;
  selected = same ? null : n.id;
  for (const el of document.querySelectorAll(".n")) {
    el.classList.toggle("sel", el.dataset.id === selected);
  }
  focusOn(selected);
  if (same) { inspectRoute(); return; }
  const out = [`<h1>${escapeHtml(n.label)}</h1>`,
    `<p class="k">${escapeHtml(n.kind)}</p>`];
  if (n.file) out.push(`<p class="k">${escapeHtml(n.file)}${n.line ? `:${n.line}` : ""}</p>`);
  out.push(`<h2>key</h2><p class="k" style="word-break:break-all">${escapeHtml(n.key)}</p>`);

  if (n.chain) {
    out.push("<h2>chain</h2>");
    out.push(`<p>position ${n.chain.position} · ${escapeHtml(n.chain.phase)}</p>`);
    if (n.chain.checkKind) {
      out.push(
        `<p><span class="badge ${n.chain.channel}">${n.chain.checkKind}</span> ` +
        `${n.chain.confidence} · ${n.chain.channel === "boot"
          ? "the framework reported this hook"
          : "a parser found this in the handler body"}</p>`,
      );
    }
    if (n.chain.detail) out.push(`<p class="k">${escapeHtml(n.chain.detail)}</p>`);
  }

  const cfg = payload.cfg[n.key];
  if (cfg) {
    // P2-T12: green success, red error exit, grey undetermined. A SEPARATE
    // axis from the edge styling, and the legend says so.
    out.push("<h2>execution paths</h2>");
    out.push('<svg id="flow"></svg>');
    for (const b of cfg.blocks) {
      if (b.kind === "root") continue;
      const outcome = b.outcome ?? "";
      const label = b.kind === "exit"
        ? `${b.exitForm ?? "exit"}${b.errorName ? ` · ${b.errorName}` : ""}`
        : `${b.kind}${b.condition ? ` (${clip(b.condition, 40)})` : ""}`;
      out.push(
        `<div class="cfg ${outcome}">L${b.startLine} ${escapeHtml(label)}` +
        (outcome ? ` <span class="k">${outcome}</span>` : "") + "</div>",
      );
    }
  }

  const incoming = payload.edges.filter((e) => e.target === n.id);
  const outgoing = payload.edges.filter((e) => e.source === n.id);
  out.push(`<h2>edges</h2>`);
  for (const [dir, list] of [["in", incoming], ["out", outgoing]]) {
    for (const e of list) {
      const other = dir === "in" ? e.source : e.target;
      const node = payload.nodes.find((x) => x.id === other);
      out.push(
        `<p class="k">${dir === "in" ? "←" : "→"} ${escapeHtml(node?.label ?? other)} ` +
        `<span style="color:var(--${e.confidence})">${e.type} ${e.confidence}</span></p>`,
      );
    }
  }
  $("inspector").innerHTML = out.join("");
  // After innerHTML, so the <svg id="flow"> placeholder exists to draw into.
  if (cfg) void drawFlowchart(cfg);
}

// ---------------------------------------------------------------------------
// The decision-structure flowchart (P2-T12, migration 011)
// ---------------------------------------------------------------------------
// A second, small elkjs layout scoped to ONE function — the same engine the
// main graph uses, pointed at `function_cfg` + `function_cfg_edges` instead of
// the call graph.
//
// Shape carries the construct (diamond = decision, oval = start/end,
// rectangle = try/catch/finally); colour carries the OUTCOME. That is the same
// two-axis rule the main canvas obeys, which is why a red diamond is
// impossible here: a decision has no outcome of its own, only its exits do.
const FLOW_SHAPE = (b) =>
  b.kind === "root" || b.kind === "exit" ? "terminal"
    : b.kind === "branch" || b.kind === "guard" || b.kind === "loop" ? "decision"
      : "process";

function flowLabel(b) {
  if (b.kind === "root") return "start";
  if (b.kind === "exit") {
    return `${b.exitForm ?? "exit"}${b.errorName ? ` · ${b.errorName}` : ""}`;
  }
  if (b.condition) return clip(b.condition, 30);
  return b.kind;
}

async function drawFlowchart(cfg) {
  const el = $("flow");
  if (!el) return;
  const END = "implicit-end";

  // A loop's back-edge is a self-edge. elk routes those poorly and the shape
  // is always the same arc, so it is drawn by hand and kept out of the layout.
  const selfEdges = cfg.edges.filter((e) => e.to === e.from);
  const linked = cfg.edges.filter((e) => e.to !== e.from);
  const needsEnd = linked.some((e) => e.to === null);

  const sizeOf = (b) => FLOW_SHAPE(b) === "decision"
    ? { width: 172, height: 54 }
    : { width: 150, height: 32 };

  const children = cfg.blocks.map((b) => ({ id: String(b.index), ...sizeOf(b) }));
  if (needsEnd) children.push({ id: END, width: 150, height: 32 });

  const laid = await elk.layout({
    id: "cfg",
    layoutOptions: {
      "elk.algorithm": "layered",
      // Flowcharts read top-to-bottom; the call graph reads left-to-right.
      "elk.direction": "DOWN",
      "elk.spacing.nodeNode": "20",
      "elk.layered.spacing.nodeNodeBetweenLayers": "38",
      "elk.spacing.edgeNode": "16",
    },
    children,
    edges: linked.map((e, i) => ({
      id: `fe${i}`,
      sources: [String(e.from)],
      targets: [e.to === null ? END : String(e.to)],
    })),
  });

  const pos = new Map();
  for (const c of laid.children ?? []) {
    pos.set(c.id, { x: c.x, y: c.y, w: c.width, h: c.height });
  }

  const pad = 8;
  const w = (laid.width ?? 300) + pad * 2;
  const h = (laid.height ?? 200) + pad * 2;

  // Fit the panel's width, but never below 0.7: at 9px type that is where the
  // condition text stops being readable, and a diagram nobody can read is
  // worse than one the panel has to scroll sideways for.
  // clientWidth includes the panel's padding; the content box is 24px narrower.
  const avail = Math.max((el.parentElement?.clientWidth ?? 320) - 26, 180);
  const scale = Math.max(0.7, Math.min(1, avail / w));
  el.setAttribute("viewBox", `${-pad} ${-pad} ${w} ${h}`);
  el.setAttribute("preserveAspectRatio", "xMidYMin meet");
  el.setAttribute("width", String(Math.round(w * scale)));
  el.setAttribute("height", String(Math.round(h * scale)));
  el.innerHTML = "";

  // Self-contained marker: this is a different <svg> from the main canvas and
  // must not depend on whether that one has been drawn yet.
  const defs = svg("defs");
  const marker = svg("marker", {
    id: "farrow", viewBox: "0 0 10 10", refX: "9", refY: "5",
    markerWidth: "5", markerHeight: "5", orient: "auto-start-reverse",
  });
  marker.append(svg("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#6e7681" }));
  defs.append(marker);
  el.append(defs);

  // Edges first, so shapes sit on top of the arrowheads.
  laid.edges?.forEach((le, i) => {
    const model = linked[i];
    const section = le.sections?.[0];
    if (!model || !section) return;
    const points = [section.startPoint, ...(section.bendPoints ?? []), section.endPoint];
    el.append(svg("path", {
      class: `fe ${model.label}`,
      d: points.map((p, j) => `${j === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" "),
      "marker-end": "url(#farrow)",
    }));

    // `next` is an unlabelled arrow — a plain sequence needs no word. The
    // arms that a reader has to tell apart are the ones that get text.
    if (model.label !== "next") {
      const mid = points[Math.floor(points.length / 2)];
      const t = svg("text", { class: "arm", x: mid.x + 4, y: mid.y - 3 });
      t.textContent = model.label === "loop_back" ? "loop" : model.label;
      el.append(t);
    }
  });

  for (const b of cfg.blocks) {
    const p = pos.get(String(b.index));
    if (!p) continue;
    const shape = FLOW_SHAPE(b);
    const cls = `b ${shape} ${b.outcome ?? ""}`.trim();

    if (shape === "decision") {
      // A real diamond, not a rounded box: the ISO shape is what makes a
      // two-way branch readable at a glance.
      el.append(svg("polygon", {
        class: cls,
        points: [
          `${p.x + p.w / 2},${p.y}`,
          `${p.x + p.w},${p.y + p.h / 2}`,
          `${p.x + p.w / 2},${p.y + p.h}`,
          `${p.x},${p.y + p.h / 2}`,
        ].join(" "),
      }));
    } else if (shape === "terminal") {
      el.append(svg("rect", {
        class: cls, x: p.x, y: p.y, width: p.w, height: p.h,
        rx: p.h / 2, ry: p.h / 2,
      }));
    } else {
      el.append(svg("rect", {
        class: cls, x: p.x, y: p.y, width: p.w, height: p.h, rx: 3,
      }));
    }

    const text = svg("text", {
      x: p.x + p.w / 2, y: p.y + p.h / 2 + 3, "text-anchor": "middle",
    });
    text.textContent = clip(flowLabel(b), shape === "decision" ? 26 : 22);
    const title = svg("title");
    title.textContent =
      `L${b.startLine}-${b.endLine} ${b.kind}` +
      (b.condition ? `\n${b.condition}` : "") +
      (b.outcome ? `\noutcome: ${b.outcome}` : "");
    text.append(title);
    el.append(text);
  }

  // The hand-drawn back-edges: an arc down the left side, returning to the
  // condition that controls the loop.
  for (const e of selfEdges) {
    const p = pos.get(String(e.from));
    if (!p) continue;
    const left = p.x - 14;
    el.append(svg("path", {
      class: "fe loop_back",
      d: `M ${p.x} ${p.y + p.h / 2} C ${left - 12} ${p.y + p.h / 2},` +
         ` ${left - 12} ${p.y - 6}, ${p.x + p.w / 2} ${p.y}`,
      "marker-end": "url(#farrow)",
    }));
    const t = svg("text", { class: "arm", x: left - 22, y: p.y + p.h / 2 });
    t.textContent = "loop";
    el.append(t);
  }

  if (needsEnd) {
    const p = pos.get(END);
    if (p) {
      el.append(svg("rect", {
        class: "b terminal", x: p.x, y: p.y, width: p.w, height: p.h,
        rx: p.h / 2, ry: p.h / 2,
      }));
      const t = svg("text", {
        x: p.x + p.w / 2, y: p.y + p.h / 2 + 3, "text-anchor": "middle",
        fill: "var(--dim)",
      });
      // Named, not blank: control reaching here is an implicit return, which
      // is a fact about the function, not a gap in the analysis.
      t.textContent = "end (implicit)";
      el.append(t);
    }
  }
}

function inspectRoute() {
  const out = [
    `<h1>${escapeHtml(payload.route.method)} ${escapeHtml(payload.route.url)}</h1>`,
    `<p class="k">${escapeHtml(payload.route.service)}</p>`,
  ];
  if (payload.services.length > 1) {
    out.push("<h2>services on this flow</h2>");
    out.push(`<p>${payload.services.map(escapeHtml).join(" → ")}</p>`);
  }
  // R61 has a UI form too. Gaps get a panel, not an absence: a graph that
  // silently omits what it could not resolve looks complete.
  out.push(`<h2>unknown — ${payload.unknowns.length}</h2>`);
  if (payload.unknowns.length === 0) {
    out.push('<p class="k">no unresolved call sites on this path.</p>');
  }
  for (const u of payload.unknowns) {
    out.push(
      `<p class="gap">${escapeHtml(u.where)}<br>` +
      `<span class="k">${escapeHtml(u.symbol)} → ${escapeHtml(u.target ?? "?")}<br>` +
      `${escapeHtml(u.reason)}</span></p>`,
    );
  }
  $("inspector").innerHTML = out.join("");
}

function renderLegend() {
  const l = payload?.legend;
  if (!l) { $("legend").innerHTML = ""; return; }
  const block = (title, obj) =>
    `<b>${escapeHtml(obj.axis)}</b>` +
    Object.entries(obj).filter(([k]) => k !== "axis")
      .map(([k, v]) => `<div class="row">${escapeHtml(v)}</div>`).join("");
  $("legend").innerHTML =
    block("confidence", l.confidence) + '<div class="sep"></div>' +
    block("outcome", l.outcome) + '<div class="sep"></div>' +
    block("security", l.security) + '<div class="sep"></div>' +
    '<div class="row">click a node to focus what it touches · click it again to clear</div>';
}

// ---------------------------------------------------------------------------
// Pan and zoom. ~25 lines, which is why this needs no graph framework.
// ---------------------------------------------------------------------------
function applyView() {
  $("viewport").setAttribute(
    "transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}
(() => {
  const svgEl = $("canvas");
  let dragging = false, lastX = 0, lastY = 0;
  svgEl.addEventListener("mousedown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  addEventListener("mouseup", () => { dragging = false; });
  addEventListener("mousemove", (e) => {
    if (!dragging) return;
    view.x += e.clientX - lastX; view.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyView();
  });
  svgEl.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    view.k = Math.min(3, Math.max(0.15, view.k * factor));
    applyView();
  }, { passive: false });
})();

(function () {
  // Sidebar widths, tracked in px. The grid slots are
  //   left | handle | main | handle | right
  // `--side-left` / `--side-right` feed grid-template-columns.
  const sizes = { left: 260, right: 340 };
  const docs = document.documentElement;
  const MIN = 160;
  const apply = () => {
    docs.style.setProperty("--side-left", `${sizes.left}px`);
    docs.style.setProperty("--side-right", `${sizes.right}px`);
  };
  apply();

  for (const handle of document.querySelectorAll(".resize-handle")) {
    handle.addEventListener("mousedown", (down) => {
      if (down.button !== 0) return;
      down.preventDefault();
      const side = handle.dataset.col === "0" ? "left" : "right";
      handle.classList.add("dragging");
      docs.style.cursor = "col-resize";
      docs.style.userSelect = "none";

      const move = (e) => {
        const d = e.clientX - down.clientX;
        const limit = Math.max(window.innerWidth * 0.5, MIN);
        sizes[side] = side === "left"
          ? Math.min(limit, Math.max(MIN, sizes.left + d))
          : Math.min(limit, Math.max(MIN, sizes.right - d));
        apply();
      };
      const up = () => {
        handle.classList.remove("dragging");
        docs.style.cursor = "";
        docs.style.userSelect = "";
        removeEventListener("mousemove", move);
        removeEventListener("mouseup", up);
      };
      addEventListener("mousemove", move);
      addEventListener("mouseup", up);
    });
  }
})();

// ---------------------------------------------------------------------------
function svg(tag, attrs = {}) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  return el;
}
function rect(x, y, w, h, cls) {
  return svg("rect", { x, y, width: w, height: h, class: cls, rx: 6 });
}
/**
 * Half-way along a polyline by LENGTH, not by vertex count.
 *
 * Picking the middle vertex puts the label on an endpoint whenever the route
 * has an even number of points — which for a two-point edge means writing
 * "writes" on top of the datastore box it points at.
 */
function midpointOf(points) {
  const seg = [];
  let total = 0;
  for (let i = 1; i < points.length; i += 1) {
    const d = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    seg.push(d);
    total += d;
  }
  let walked = 0;
  for (let i = 0; i < seg.length; i += 1) {
    if (walked + seg[i] >= total / 2) {
      const t = seg[i] === 0 ? 0 : (total / 2 - walked) / seg[i];
      return {
        x: points[i].x + (points[i + 1].x - points[i].x) * t,
        y: points[i].y + (points[i + 1].y - points[i].y) * t,
      };
    }
    walked += seg[i];
  }
  return points[0];
}
/**
 * One arrowhead per confidence.
 *
 * A single grey marker put a neutral tip on every line, so a red `unresolved`
 * edge appeared to change meaning at its end — the confidence axis dropping out
 * exactly where the eye lands. The fill is the same custom property the stroke
 * uses, so the two cannot drift apart.
 */
function ensureDefs() {
  if ($("canvas").querySelector("defs")) return;
  const defs = svg("defs");
  for (const confidence of CONFIDENCES) {
    const marker = svg("marker", {
      id: `arrow-${confidence}`, viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse",
    });
    marker.append(svg("path", {
      d: "M 0 0 L 10 5 L 0 10 z", fill: `var(--${confidence})`,
    }));
    defs.append(marker);
  }
  $("canvas").prepend(defs);
}
const clip = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s);
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

boot();
</script>
